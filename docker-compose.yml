services:
  go_db:
    image: postgres:latest
    container_name: go_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: go_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  go_app:
    container_name: go_app
    image: go-api-tutorial
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - go_db
volumes:
  db_data: